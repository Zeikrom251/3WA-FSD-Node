<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit User</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body>
    <nav>
      <a href="/">Home</a>
      <a href="/users">Users</a>
    </nav>
    <main>
      <form action="/edit" method="POST">
        <input type="hidden" name="oldName" value="<%= student.name %>" />
        <label
          >Name:
          <input type="text" name="name" value="<%= student.name %>" required
        /></label>
        <label>
          Date:
          <input
            type="date"
            name="birth"
            value="<%= (student.birth && student.birth.match(/^\d{4}-\d{2}-\d{2}$/)) ? student.birth : (function() { var m = student.birth.match(/(\d{4})-(\d{2})-(\d{2})/); return m ? m[1] + '-' + m[2] + '-' + m[3] : '' })() %>"
            required />
        </label>
        <button type="submit">Save</button>
      </form>
    </main>
  </body>
</html>
